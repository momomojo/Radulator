name: Roll Back Failed Production Smoke

on:
  repository_dispatch:
    types: [radulator-live-smoke-rollback-request]

permissions:
  contents: write
  actions: read

concurrency:
  group: radulator-pages-rollback
  queue: max
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted rollback selector
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Select and dispatch last successful production SHA
        id: select
        env:
          FAILED_RUN_ID: ${{ github.event.client_payload.failedRunId }}
        run: node scripts/select-rollback-deployment.mjs --failed-run-id "$FAILED_RUN_ID" --output rollback-selection.json --dispatch

      - name: Record rollback dispatch
        run: |
          echo "## Production rollback dispatched" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failed run: ${{ steps.select.outputs.failed_run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Restored source run: ${{ steps.select.outputs.source_run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Restored SHA: ${{ steps.select.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
