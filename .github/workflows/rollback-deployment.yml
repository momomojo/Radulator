name: Roll Back Failed Production Smoke

on:
  workflow_run:
    workflows: [Deploy to GitHub Pages]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: radulator-pages-rollback
  queue: max
  cancel-in-progress: false

jobs:
  rollback:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'push' || (github.event.workflow_run.event == 'repository_dispatch' && startsWith(github.event.workflow_run.display_title, 'Deploy radulator-auto-merge-deploy:')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted rollback selector
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Select and dispatch last successful production SHA
        id: select
        run: node scripts/select-rollback-deployment.mjs --failed-run-id ${{ github.event.workflow_run.id }} --output rollback-selection.json --dispatch

      - name: Record rollback dispatch
        run: |
          echo "## Production rollback dispatched" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failed run: ${{ steps.select.outputs.failed_run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Restored source run: ${{ steps.select.outputs.source_run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Restored SHA: ${{ steps.select.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
