name: Deploy to GitHub Pages
run-name: Deploy ${{ github.event_name == 'push' && format('main-push:{0}', github.sha) || format('{0}:{1}', github.event.action, github.event.client_payload.ref) }}

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [radulator-auto-merge-deploy, radulator-verified-rollback-deploy]

permissions:
  contents: read
  pull-requests: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  queue: max
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.authorize.outputs.ref }}
      mode: ${{ steps.authorize.outputs.mode }}
    steps:
      - name: Checkout trusted deployment authorizer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Authorize immutable deployment source
        id: authorize
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/authorize-deployment.mjs

  build:
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ needs.authorize.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.ref }}
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          
      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high --omit=dev

      - name: Build
        run: npm run build
        env:
          VITE_GA4_MEASUREMENT_ID: ${{ secrets.VITE_GA4_MEASUREMENT_ID }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ secrets.VITE_GOOGLE_SITE_VERIFICATION }}
          VITE_BING_SITE_VERIFICATION: ${{ secrets.VITE_BING_SITE_VERIFICATION }}
          VITE_SEARCH_VERIFICATION_META: ${{ secrets.VITE_SEARCH_VERIFICATION_META }}

      - name: Checkout trusted release marker writer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .radulator-controller

      - name: Bind artifact to authorized immutable SHA
        run: node .radulator-controller/scripts/write-release-marker.mjs --dist dist --sha ${{ needs.authorize.outputs.ref }}
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [authorize, build]
    outputs:
      rollback_required: ${{ steps.rollback-classification.outputs.required }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout indexing scripts
        uses: actions/checkout@v4
        with:
          # Controller scripts always come from trusted current main, while the
          # Pages artifact may intentionally be an older immutable rollback ref.
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify deployed site
        id: smoke
        run: node scripts/post-deploy-smoke.mjs --base-url https://radulator.com --expected-sha ${{ needs.build.outputs.ref }} --attempts 12 --delay-ms 10000 --output production-smoke.json

      - name: Upload production smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.run_id }}
          path: production-smoke.json
          if-no-files-found: warn
          retention-days: 30

      - name: Classify rollback requirement
        id: rollback-classification
        if: always()
        env:
          PAGES_OUTCOME: ${{ steps.deployment.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          DEPLOYMENT_MODE: ${{ needs.authorize.outputs.mode }}
        run: node scripts/rollback-request.mjs

      - name: Ping search indexes
        run: node scripts/ping-search-indexes.mjs --site-url https://radulator.com --sitemap-url https://radulator.com/sitemap.xml

  request-rollback:
    if: ${{ always() && needs.deploy.outputs.rollback_required == 'true' && needs.authorize.outputs.mode != 'verified-rollback' }}
    needs: [authorize, deploy]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted rollback requester
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Request exact failed-run rollback evaluation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/select-rollback-deployment.mjs --request --failed-run-id ${{ github.run_id }}
