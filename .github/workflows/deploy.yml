name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [radulator-auto-merge-deploy]
  workflow_dispatch:
    inputs:
      ref:
        description: Immutable source SHA to deploy (blank uses current main)
        required: false
        type: string
      rollback_of_run:
        description: Failed deployment run being rolled back
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref || inputs.ref || github.sha }}
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          
      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high --omit=dev || echo "::warning::Dev-only audit findings (no production impact)"

      - name: Build
        run: npm run build
        env:
          VITE_GA4_MEASUREMENT_ID: ${{ secrets.VITE_GA4_MEASUREMENT_ID }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ secrets.VITE_GOOGLE_SITE_VERIFICATION }}
          VITE_BING_SITE_VERIFICATION: ${{ secrets.VITE_BING_SITE_VERIFICATION }}
          VITE_SEARCH_VERIFICATION_META: ${{ secrets.VITE_SEARCH_VERIFICATION_META }}
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout indexing scripts
        uses: actions/checkout@v4
        with:
          # Controller scripts always come from trusted current main, while the
          # Pages artifact may intentionally be an older immutable rollback ref.
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify deployed site
        run: node scripts/post-deploy-smoke.mjs --base-url https://radulator.com --attempts 12 --delay-ms 10000 --output production-smoke.json

      - name: Upload production smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.run_id }}
          path: production-smoke.json
          if-no-files-found: warn
          retention-days: 30

      - name: Ping search indexes
        run: node scripts/ping-search-indexes.mjs --site-url https://radulator.com --sitemap-url https://radulator.com/sitemap.xml
