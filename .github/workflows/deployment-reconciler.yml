name: Reconcile Production Deployment

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: [Approval-Bound Automatic Merge]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: radulator-deployment-reconciler
  queue: max
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted deployment reconciler
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Reconcile current main deployment obligation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/reconcile-deployment.mjs
