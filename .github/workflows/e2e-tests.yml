name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Run full test suite (takes 2+ hours)'
        required: false
        default: 'false'
        type: boolean

# PR-controlled application/test code runs with a read-only repository token.
permissions:
  contents: read

concurrency:
  # Supersede only older runs for the same PR. The run-id suffix keeps push
  # and manual runs out of a shared pending queue, so none are discarded.
  group: e2e-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}-run-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke-tests:
    name: Smoke Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PR checks are associated with the source head by GitHub, so execute
          # that exact SHA instead of the synthetic merge ref.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tooling checks
        run: |
          npm audit --omit=dev --audit-level=high
          node --check scripts/capture-feature-proof.mjs
          node --check scripts/check-radulator-invariants.mjs
          node --check scripts/check-radulator-invariants.test.mjs
          node --check scripts/collect-loop-metrics.mjs
          node --check scripts/independent-review-gate.mjs
          node --check scripts/release-workflow-permissions.test.mjs
          node --check scripts/release-policy.mjs
          node --check scripts/auto-merge.mjs
          node --check scripts/authorize-deployment.mjs
          node --check scripts/deployment-run-identity.mjs
          node --check scripts/reconcile-deployment.mjs
          node --check scripts/post-deploy-smoke.mjs
          node --check scripts/write-release-marker.mjs
          node --check scripts/rollback-request.mjs
          node --check scripts/select-rollback-deployment.mjs
          node --check ops/hermes/radulator/judge-candidates.mjs
          node --check ops/hermes/radulator/judge-attest.mjs
          node --check scripts/search-verification-meta.mjs
          node --check scripts/ping-search-indexes.mjs
          python3 -m py_compile \
            ops/hermes/radulator/lifecycle_controller.py \
            ops/hermes/radulator/learning_context.py \
            ops/hermes/radulator/formspree_feedback_intake.py \
            ops/hermes/radulator/seed_convert_gate_dedupe.py \
            ops/hermes/radulator/install.py
          bash -n scripts/dev-local.sh
          npm run test:search-verification
          npm run test:calculator-helper
          npm run test:invariants
          npm run test:release-policy
          npm run test:independent-review-gate
          npm run test:auto-merge
          npm run test:release-workflow-permissions
          npm run test:authorize-deployment
          npm run test:reconcile-deployment
          npm run test:post-deploy-smoke
          npm run test:release-marker
          npm run test:rollback-deployment
          npm run check:invariants

      # This named step makes the exact-head Smoke check's lifecycle coverage
      # explicit to the clinical judge, while the separate check below remains
      # independently selectable as signed CI evidence after this release.
      - name: Verify Hermes release-control suites in Smoke evidence
        run: |
          npm run test:hermes-judge-candidates
          npm run test:hermes-judge-attest
          npm run test:hermes-lifecycle
          npm run test:hermes-learning
          npm run test:hermes-feedback-intake
          npm run test:hermes-seed-convert
          npm run test:hermes-guideline-registry
          npm run test:hermes-install-core

      # These commands are named literally so a successful immutable Smoke
      # check is exact-head evidence for every source audit cited by ROADMAP.md.
      # Keep the network-backed audit in one required job to avoid concurrent
      # duplicate requests to the primary-source hosts.
      - name: Verify roadmap clinical source audits at exact head
        run: |
          npm run test:kbrc-source
          npm run test:cac-drs-source
          npm run test:bosniak-source
          npm run test:hermes-guideline-registry
          npm run test:birads-fda-source
          node tests/roadmap-guideline-status.test.mjs

      - name: Build application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npx playwright test tests/e2e/smoke.spec.js --project=chromium
        env:
          CI: true

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-report
          path: playwright-report/
          retention-days: 3

  hermes-release-control-tests:
    # Keep this context stable: the protected develop/main rules require this
    # exact GitHub Actions check name. The job also runs the production audit.
    name: Hermes Release Control Tests
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release-control, intake, and production dependency evidence
        run: |
          npm audit --omit=dev --audit-level=high
          python3 -m py_compile \
            ops/hermes/radulator/lifecycle_controller.py \
            ops/hermes/radulator/learning_context.py \
            ops/hermes/radulator/formspree_feedback_intake.py \
            ops/hermes/radulator/seed_convert_gate_dedupe.py \
            ops/hermes/radulator/install.py
          npm run test:search-verification
          npm run test:calculator-helper
          npm run test:invariants
          npm run test:release-policy
          npm run test:independent-review-gate
          npm run test:auto-merge
          npm run test:release-workflow-permissions
          npm run test:authorize-deployment
          npm run test:reconcile-deployment
          npm run test:post-deploy-smoke
          npm run test:release-marker
          npm run test:rollback-deployment
          npm run test:hermes-judge-candidates
          npm run test:hermes-judge-attest
          npm run test:hermes-lifecycle
          npm run test:hermes-learning
          npm run test:hermes-feedback-intake
          npm run test:hermes-seed-convert
          npm run test:hermes-guideline-registry
          npm run test:hermes-install-core
          npm run check:invariants


  targeted-tests:
    name: Targeted Calculator Tests
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Keep executed code coherent with the source-head check identity.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      # Coverage gate: every calculator must have a dedicated spec whose
      # navigation target resolves against CURRENT registry metadata. Fails on
      # new untested calculators AND on specs orphaned by renames.
      - name: Spec coverage check
        run: node scripts/spec-map.js --check

      - name: Detect changed targeted specs
        id: changed
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'src/components/calculators/*.jsx' | grep -vE 'index|registry|FeedbackForm' || true)
          # Spec-only PRs do not change calculator source, so run their changed
          # specs directly. If source and specs both changed, the run step
          # unions these paths with spec-map output.
          CHANGED_SPECS=$(git diff --name-only --diff-filter=AMR origin/${{ github.base_ref }}...HEAD -- 'tests/e2e/*.spec.js' 'tests/e2e/**/*.spec.js' | sort -u || true)
          # Space-joined single line: a multiline output would embed raw
          # newlines into the github-expression substitution downstream, acting
          # as command separators inside command substitution and silently
          # dropping all but the first file's specs (gate finding, PR #17).
          # NOTE: never write a literal dollar-double-brace expression in these
          # comments — Actions template-expands run blocks before the shell
          # sees them, and an empty expression fails the whole workflow file.
          CHANGED_SPACE=$(printf '%s' "$CHANGED" | tr '\n' ' ')
          SPECS_SPACE=$(printf '%s' "$CHANGED_SPECS" | tr '\n' ' ')
          echo "files=$CHANGED_SPACE" >> "$GITHUB_OUTPUT"
          echo "spec_files=$SPECS_SPACE" >> "$GITHUB_OUTPUT"
          if [ -n "$CHANGED" ] || [ -n "$CHANGED_SPECS" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Node
        if: steps.changed.outputs.any == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.changed.outputs.any == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.changed.outputs.any == 'true'
        run: npx playwright install --with-deps chromium

      # Playwright's CI webServer is `vite preview`, which serves an existing
      # dist/ and never builds. Without this step the server never comes up
      # (120s timeout, zero tests run). Latent until the first PR touching
      # calculator source post-release-train (PR #30, 2026-06-12).
      - name: Build application
        if: steps.changed.outputs.any == 'true'
        run: npm run build

      - name: Run targeted specs
        if: steps.changed.outputs.any == 'true'
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          CHANGED_SPECS="${{ steps.changed.outputs.spec_files }}"
          : > targeted-specs.txt

          if [ -n "$FILES" ]; then
            printf '%s\n' "$FILES" | xargs node scripts/spec-map.js --specs-for >> targeted-specs.txt
          fi

          if [ -n "$CHANGED_SPECS" ]; then
            printf '%s\n' "$CHANGED_SPECS" | tr ' ' '\n' >> targeted-specs.txt
          fi

          sort -u targeted-specs.txt | awk 'NF' > targeted-specs.unique.txt
          SPECS=$(tr '\n' ' ' < targeted-specs.unique.txt)
          if [ -z "$SPECS" ]; then
            echo "No targeted specs resolved; refusing to run an empty Playwright command."
            exit 1
          fi

          echo "Running targeted specs: $SPECS"
          npx playwright test $SPECS --project=chromium
        env:
          CI: true

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: targeted-test-report
          path: playwright-report/
          retention-days: 3

  full-tests:
    name: Full Test Suite
    # Auto-runs for every PR targeting main (promotion batches from develop
    # and hotfixes): production deploys only on a green full suite. Feature
    # PRs target develop and need only smoke + targeted.
    if: github.event.inputs.full_suite == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Promotion/hotfix CI executes the exact source head under review.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run full test suite
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: full-test-report
          path: playwright-report/
          retention-days: 3

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 3
