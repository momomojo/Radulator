name: Source Audit Nightly

# Runs every network clinical source audit against main and then develop each night, and keeps one
# "Source audit drift: <id>" issue per failing audit (scripts/report-source-audit-drift.mjs), so
# source drift shows up before it blocks a promotion. The runner, manifest and reporter always come
# from the default branch; the audits come from each ref. The NCBI key reaches only the two audit
# steps, and only the report job may write issues.
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radulator-source-audit-nightly
  cancel-in-progress: false

jobs:
  audit:
    name: Nightly clinical source audits
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout trusted runner (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: controller

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: ref-main

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: ref-develop

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            ref-main/package-lock.json
            ref-develop/package-lock.json

      - name: Install main dependencies
        working-directory: ref-main
        run: npm ci

      # Both refs share one per-run source cache under RUNNER_TEMP (never actions/cache), so every
      # artifact is fetched over HTTPS at least once per night.
      - name: Run every source audit on main
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: >-
          node controller/scripts/run-source-audits.mjs --all
          --manifest controller/scripts/source-audit-manifest.json
          --cwd ref-main --label main
          --attempts 3 --backoff-seconds 60,180 --audit-timeout-seconds 600 --budget-seconds 3000
          --results results-main.json

      - name: Install develop dependencies
        if: ${{ !cancelled() }}
        working-directory: ref-develop
        run: npm ci

      - name: Run every source audit on develop
        if: ${{ !cancelled() }}
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: >-
          node controller/scripts/run-source-audits.mjs --all
          --manifest controller/scripts/source-audit-manifest.json
          --cwd ref-develop --label develop
          --attempts 3 --backoff-seconds 60,180 --audit-timeout-seconds 600 --budget-seconds 3000
          --results results-develop.json

      - name: Upload nightly results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-audit-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: results-*.json
          if-no-files-found: warn
          retention-days: 90

  report:
    name: Report source-audit drift
    needs: audit
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout trusted reporter (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Re-running only this job after its audit job succeeded finds no results for the new
      # attempt; re-run the whole workflow instead (the next night also recovers on its own).
      - name: Download tonight's results
        uses: actions/download-artifact@v4
        with:
          name: source-audit-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: tonight

      - name: Fetch the previous nightly results (transport-failure streak)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p previous
          previous_run=$(gh run list --repo "$REPO" --workflow source-audit-nightly.yml --status completed --limit 20 \
            --json databaseId --jq "map(select(.databaseId != $RUN_ID)) | .[0].databaseId // empty" || true)
          if [ -n "$previous_run" ]; then
            gh run download "$previous_run" --repo "$REPO" --dir previous || echo "No results from run $previous_run."
          fi

      - name: Open, update or close drift issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set --
          for file in previous/*/results-*.json previous/results-*.json; do
            if [ -f "$file" ]; then set -- "$@" --previous "$file"; fi
          done
          node scripts/report-source-audit-drift.mjs \
            --results tonight/results-main.json --results tonight/results-develop.json "$@"
